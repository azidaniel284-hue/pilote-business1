# Configuration Netlify — site statique (1 fichier) + 2 fonctions serverless
[build]
  publish = "."
  functions = "netlify/functions"

# Les variables secrètes (CHARIOW_API_KEY, GROQ_API_KEY, SUPABASE_SERVICE_ROLE)
# NE sont PAS ici : on les définit dans Netlify → Site settings → Environment variables.

# Maintien en vie de la base Supabase (offre gratuite = pause après 7 jours sans
# requête). Ping automatique le lundi et le jeudi à 6 h UTC : le projet ne dort
# plus jamais, sans abonnement.
[functions."keep-alive"]
  schedule = "0 6 * * 1,4"

# Rappels quotidiens (Web Push). On tourne CHAQUE HEURE, pile à l'heure ronde :
# la fonction ne notifie que les abonnés pour qui il est l'heure choisie DANS
# LEUR fuseau. Un utilisateur à Dubaï et un utilisateur à Lomé reçoivent donc
# tous les deux leur rappel à 8 h chez eux, avec une seule planification.
[functions."push-daily"]
  schedule = "0 * * * *"
